<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Call App</title>
  <!-- 3D Avatar Rendering Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background-color: #000; font-family: sans-serif; overflow: hidden; }
    model-viewer { width: 100vw; height: 100vh; }
    .chat-box {
      position: absolute; top: 20px; left: 20px; right: 20px;
      background: rgba(0,0,0,0.7); color: white; padding: 15px;
      border-radius: 12px; text-align: center; font-size: 16px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .mic-btn {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      width: 70px; height: 70px; border-radius: 50%; background: #e91e63;
      border: none; color: white; font-size: 28px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.6);
    }
  </style>
</head>
<body>

  <!-- 3D Avatar (यहाँ अपना Ready Player Me का लिंक डालें) -->
  <model-viewer id="avatar" src=https://i.postimg.cc/gkNJWfJD/file-00000000b23881f483a575a047b700a9.pngcamera-controls auto-play animation-name="Idle"></model-viewer>

  <!-- Status / Chat Box -->
  <div class="chat-box" id="status">माइक बटन दबाएं और बोलें...</div>

  <!-- Mic Button -->
  <button class="mic-btn" onclick="startSpeech()">🎙️</button>

  <script>
    // यहाँ अपनी Groq API Key डालें
    const GROQ_API_KEY = "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";

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';

    function startSpeech() {
      document.getElementById("status").innerText = "सुन रहा हूँ...";
      recognition.start();
    }

    recognition.onresult = async (event) => {
      const userMessage = event.results[0][0].transcript;
      document.getElementById("status").innerText = "आप: " + userMessage;
      getAIReply(userMessage);
    };

    async function getAIReply(text) {
      document.getElementById("status").innerText = "AI सोच रही है...";
      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: "आप एक बहुत ही प्यारी एआई गर्लफ्रेंड हैं। हिंदी में छोटे और प्यार भरे जवाब दें।" },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        const aiReply = data.choices[0].message.content;
        document.getElementById("status").innerText = aiReply;
        speak(aiReply);
      } catch (err) {
        document.getElementById("status").innerText = "कनेक्शन एरर, दोबारा कोशिश करें!";
      }
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
